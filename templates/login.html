{% extends 'base.html' %}
{% block content %}
<div class="max-w-sm mx-auto mt-24 bg-slate-800 p-6 rounded-xl">
  <h1 class="text-xl font-bold mb-4">🔐 {% if first %}ساخت پسورد پنل{% else %}ورود به پنل{% endif %}</h1>
  {% if error %}<p class="text-red-300 text-sm mb-3">{{ error }}</p>{% endif %}
  <form method="post" class="grid gap-3">
    {% csrf_token %}
    <input type="password" name="password" placeholder="پسورد" required autofocus dir="ltr" class="bg-slate-700 rounded p-2">
    {% if first %}
    <input type="password" name="password2" placeholder="تکرار پسورد" required dir="ltr" class="bg-slate-700 rounded p-2">
    {% endif %}
    <button class="bg-emerald-600 hover:bg-emerald-500 rounded p-2 font-bold">{% if first %}ساخت و ورود{% else %}ورود{% endif %}</button>
  </form>
</div>
{% endblock %}
