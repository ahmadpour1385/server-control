{% extends 'base.html' %}
{% block content %}
<div class="mb-5">
  <h1 class="page-title">سرورها</h1>
  <p class="muted text-sm">مدیریت زنده سرورهای لینوکس و ویندوز</p>
</div>

<details class="card mb-5" {% if not servers %}open{% endif %}>
  <summary><svg class="icon"><use href="#i-plus"/></svg> افزودن سرور</summary>
  <form hx-post="{% url 'add' %}" hx-target="#server-list"
        hx-on::after-request="this.reset(); this.closest('details').open = false"
        class="panel-body grid gap-3 md:grid-cols-2">
    <div>
      <label class="label">اسم سرور</label>
      <input name="name" required class="input" placeholder="مثلاً web-1">
    </div>
    <div>
      <label class="label">سیستم‌عامل</label>
      <select name="os" class="input">
        <option value="linux">Linux (SSH)</option>
        <option value="windows">Windows (WinRM)</option>
      </select>
    </div>
    <div>
      <label class="label">آدرس (IP یا دامنه)</label>
      <input name="host" required dir="ltr" class="input" placeholder="203.0.113.10">
    </div>
    <div>
      <label class="label">پورت</label>
      <input name="port" type="number" dir="ltr" class="input" placeholder="خالی = پیش‌فرض (22 یا 5985)">
    </div>
    <div>
      <label class="label">نام کاربری</label>
      <input name="username" required dir="ltr" class="input">
    </div>
    <div class="flex items-end">
      <button class="btn btn-primary w-full" style="justify-content:center">افزودن</button>
    </div>
  </form>
</details>

<div id="server-list">
  {% include 'servers/_list.html' %}
</div>
{% endblock %}
