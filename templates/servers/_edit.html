<form id="server-{{ s.id }}" hx-post="{% url 'edit_save' s.id %}" hx-target="#server-list"
      class="card card-pad grid gap-3 md:grid-cols-2 mb-3" style="border-color: var(--accent)">
  <div>
    <label class="label">اسم سرور</label>
    <input name="name" value="{{ s.name }}" required class="input">
  </div>
  <div>
    <label class="label">آدرس (IP یا دامنه)</label>
    <input name="host" value="{{ s.host }}" required dir="ltr" class="input">
  </div>
  <div>
    <label class="label">نام کاربری</label>
    <input name="username" value="{{ s.username }}" required dir="ltr" class="input">
  </div>
  <div>
    <label class="label">پورت</label>
    <input name="port" type="number" value="{{ s.port }}" dir="ltr" class="input">
  </div>
  <div class="alert alert-warn md:col-span-2">
    اگه آدرس، پورت یا نام کاربری عوض بشه، پسورد ذخیره‌شده پاک می‌شه (و با تغییر آدرس یا پورت، اثر انگشت هم).
  </div>
  <div class="md:col-span-2 flex justify-end gap-2">
    <button type="button" class="btn" hx-get="{% url 'server_list' %}" hx-target="#server-list">انصراف</button>
    <button class="btn btn-primary">ذخیره</button>
  </div>
</form>
