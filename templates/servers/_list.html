{% for s in servers %}
<div id="server-{{ s.id }}" class="bg-slate-800 p-4 rounded-xl mb-3">
  <div class="flex items-center justify-between">
    <div>
      <div class="font-bold">{{ s.name }} <span class="text-xs text-slate-400">({{ s.os }})</span></div>
      <div class="text-sm text-slate-400" dir="ltr">{{ s.username }}@{{ s.host }}:{{ s.port }}</div>
    </div>
    <div class="flex gap-4">
      <a href="{% url 'projects' s.id %}" class="text-fuchsia-400 hover:text-fuchsia-300">📦 پروژه‌ها</a>
      <a href="{% url 'files' s.id %}" class="text-amber-400 hover:text-amber-300">📂 فایل‌ها</a>
      <a href="{% url 'terminal' s.id %}" class="text-emerald-400 hover:text-emerald-300">💻 ترمینال</a>
      <button hx-get="{% url 'monitor_info' s.id %}" hx-target="#info-{{ s.id }}"
              class="text-sky-400 hover:text-sky-300">🔌 اتصال</button>
      <button hx-get="{% url 'edit_form' s.id %}" hx-target="#server-{{ s.id }}" hx-swap="outerHTML"
              class="text-slate-300 hover:text-white">✏️ ویرایش</button>
      <button hx-post="{% url 'delete' s.id %}" hx-target="#server-list"
              hx-confirm="سرور و پروژه‌هاش حذف بشن؟" class="text-red-400 hover:text-red-300">🗑️ حذف</button>
    </div>
  </div>
  {% if s.host_key %}
  <div class="flex items-center justify-between mt-2 text-xs text-slate-500">
    <span dir="ltr">🔑 {{ s.host_key }}</span>
    <button hx-post="{% url 'reset_key' s.id %}" hx-target="#server-list"
            hx-confirm="اثر انگشت پاک بشه؟ (فقط وقتی سرور رو دوباره نصب کردی)"
            class="hover:text-slate-300">ریست اثر انگشت</button>
  </div>
  {% endif %}
  <div id="info-{{ s.id }}"></div>
</div>
{% empty %}
<p class="text-slate-400">هنوز سروری اضافه نکردی 🤷</p>
{% endfor %}
