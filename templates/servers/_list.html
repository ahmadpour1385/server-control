{% for s in servers %}
<div id="server-{{ s.id }}" class="card mb-3">
  <div class="card-pad flex flex-wrap items-center justify-between gap-3">
    <div class="min-w-0">
      <div class="flex items-center gap-2">
        <span class="font-semibold">{{ s.name }}</span>
        <span class="badge">{% if s.os == 'windows' %}Windows{% else %}Linux{% endif %}</span>
      </div>
      <div class="muted text-sm" dir="ltr" style="text-align:right">{{ s.username }}@{{ s.host }}:{{ s.port }}</div>
    </div>
    <div class="flex flex-wrap items-center gap-1.5">
      <button class="btn btn-primary btn-sm" hx-get="{% url 'monitor_info' s.id %}" hx-target="#info-{{ s.id }}">
        <svg class="icon"><use href="#i-plug"/></svg> اتصال
      </button>
      <a class="btn btn-sm" href="{% url 'terminal' s.id %}"><svg class="icon"><use href="#i-terminal"/></svg> ترمینال</a>
      <a class="btn btn-sm" href="{% url 'files' s.id %}"><svg class="icon"><use href="#i-folder"/></svg> فایل‌ها</a>
      <a class="btn btn-sm" href="{% url 'projects' s.id %}"><svg class="icon"><use href="#i-package"/></svg> پروژه‌ها</a>
      <button class="btn btn-ghost btn-sm" title="ویرایش" aria-label="ویرایش"
              hx-get="{% url 'edit_form' s.id %}" hx-target="#server-{{ s.id }}" hx-swap="outerHTML">
        <svg class="icon"><use href="#i-pencil"/></svg>
      </button>
      <button class="btn btn-ghost btn-danger btn-sm" title="حذف" aria-label="حذف"
              hx-post="{% url 'delete' s.id %}" hx-target="#server-list"
              hx-confirm="سرور و پروژه‌هاش حذف بشن؟">
        <svg class="icon"><use href="#i-trash"/></svg>
      </button>
    </div>
  </div>

  <div id="info-{{ s.id }}"></div>

  {% if s.host_key %}
  <div class="card-foot flex items-center justify-between gap-3">
    <span class="muted text-xs flex items-center gap-1.5 min-w-0" dir="ltr">
      <svg class="icon"><use href="#i-key"/></svg>
      <span class="truncate">{{ s.host_key }}</span>
    </span>
    <button class="btn btn-ghost btn-sm" hx-post="{% url 'reset_key' s.id %}" hx-target="#server-list"
            hx-confirm="اثر انگشت پاک بشه؟ (فقط وقتی سرور رو دوباره نصب کردی)">
      ریست اثر انگشت
    </button>
  </div>
  {% endif %}
</div>
{% empty %}
<div class="card card-pad muted text-sm text-center">
  هنوز سروری اضافه نشده است. از بالا «افزودن سرور» را بزن.
</div>
{% endfor %}
