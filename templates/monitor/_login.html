<div class="panel-body">
  <form hx-post="{% url 'monitor_connect' s.id %}" hx-target="#info-{{ s.id }}"
        class="flex flex-wrap items-end gap-3">
    <div class="grow" style="min-width:220px">
      <label class="label">پسورد {% if s.os == 'windows' %}ویندوز{% else %}SSH{% endif %}</label>
      <input type="password" name="password" required dir="ltr" class="input">
    </div>
    <label class="check"><input type="checkbox" name="save" value="1"> ذخیره (رمزنگاری‌شده)</label>
    <button class="btn btn-primary">اتصال</button>
  </form>
  {% if error %}
  <div class="alert alert-danger mt-3">
    {{ error }}
    {% if detail %}
    <details class="mt-1 text-xs" style="color:var(--muted)">
      <summary style="cursor:pointer">جزئیات فنی</summary>
      <p class="mt-1 break-all" dir="ltr">{{ detail }}</p>
    </details>
    {% endif %}
  </div>
  {% endif %}
</div>
